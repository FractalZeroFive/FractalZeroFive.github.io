<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sidor</title>
<style>
:root{--bg:#f4f6f4;--ink:#1c2421;--muted:#56635e;--line:#d5dcd8}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--ink:#e4eae7;--muted:#9ba8a3;--line:#2c3733;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-size:1.8rem;margin:0 0 24px}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line);padding:14px 0}
a{color:inherit;font-weight:600}
p{margin:4px 0 0;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Sidor</h1>
<p>Inga sidor ännu.</p>
</main>
</body>
</html>
